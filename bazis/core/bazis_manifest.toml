# What the package is for and how to use it, for tools and AI agents (see AGENTS.md).
# `import` paths and `check` ids are verified by tests/test_manifest.py.

[package]
name = "bazis"
summary = "JSON:API services on Django + FastAPI with schemas generated from the models"
solves = [
    "REST/JSON:API CRUD for Django models",
    "filtering, sorting, pagination, sparse fieldsets, included resources",
    "totals of a list for dashboards: sum, avg, min, max, count, grouped by a field or a date bucket (meta=aggregates)",
    "OpenAPI documentation, with the resource, action and kind of each operation (x-bazis) for client generators",
    "settings from environment variables and dynamic settings in the admin",
]
requires = []
pairs_well = ["bazis-users", "bazis-permit"]

[[extension_points]]
name = "JsonApiMixin"
import = "bazis.core.models_abstract.JsonApiMixin"
use_when = "a model is a JSON:API resource (with DtMixin, UuidMixin): guide section Models"

[[extension_points]]
name = "JsonApiMixin.validate_item"
import = "bazis.core.models_abstract.JsonApiMixin"
use_when = "an invariant of an item that every write keeps (the routes, the transits, save(), the admin): raise a Django ValidationError, 422 ERR_ITEM_INVALID; changes is ItemChanges (Invariants of the items)"

[[extension_points]]
name = "JsonApiMixin.lock_on_write"
import = "bazis.core.models_abstract.JsonApiMixin"
use_when = "an invariant counted under the lock of a parent (no more than N per parent, a unique value per parent): lock_on_write = ('<fk>',) (Invariants of the items)"

[[extension_points]]
name = "defer_validate_item"
import = "bazis.core.item_validation.defer_validate_item"
use_when = "validate several writes of an item once (a script, a task), or the writes so far in a hook: `with defer_validate_item() as scope: scope.validate()`"

[[extension_points]]
name = "TranslatedSchemaModel"
import = "bazis.core.utils.schemas.TranslatedSchemaModel"
use_when = "a pydantic model with lazy texts whose JSON schema the code reads itself (model_json_schema() outside the OpenAPI)"

[[extension_points]]
name = "ValidateItemAdminMixin"
import = "bazis.core.admin_abstract.ValidateItemAdminMixin"
use_when = "the admin change form validates the item once and shows the errors of validate_item"

[[extension_points]]
name = "JsonapiRouteBase"
import = "bazis.core.routes_abstract.jsonapi.JsonapiRouteBase"
use_when = "CRUD and relationships endpoints of a model (Routes)"

[[extension_points]]
name = "RestrictedQsRouteMixin.restrict_queryset"
import = "bazis.core.routes_abstract.jsonapi.RestrictedQsRouteMixin"
use_when = "the objects of a model a user may see and link, for the relationships, `included` and filters of the other routes: override the classmethod in the default route of the model"

[[extension_points]]
name = "SchemaFields"
import = "bazis.core.schemas.fields.SchemaFields"
use_when = "include or exclude fields of a route, per action (CrudApiAction)"

[[extension_points]]
name = "JsonapiRouteBase.query_fields"
import = "bazis.core.routes_abstract.jsonapi.JsonapiRouteBase"
use_when = "a package changes the LIST schema of a route per user: the fields filter, sort and search reach"

[[extension_points]]
name = "route_search_fields"
import = "bazis.core.utils.query_complex.route_search_fields"
use_when = "a tool needs the search fields a route searches (declared, or by default the text fields of its LIST schema)"

[[extension_points]]
name = "calc_property"
import = "bazis.core.utils.orm.calc_property"
use_when = "a calculated field fetched by the query of a route (FieldAnnotate, FieldDynamic, a subquery) or computed from the item (Calculated fields)"

[[extension_points]]
name = "point_distance"
import = "bazis.core.utils.geo.point_distance"
use_when = "a distance in meters from a PointField to a point in the code; point_within filters (API conventions, Points and distances)"

[[extension_points]]
name = "bazis_messages"
import = "bazis.core.management.commands.bazis_messages.Command"
use_when = "the translations of the project: make, status, apply <file.json>, compile"

[[extension_points]]
name = "UniqNumberMixin"
import = "bazis.core.models_abstract.UniqNumberMixin"
use_when = "a human-readable number of an item from a database sequence"

[[extension_points]]
name = "translated_name"
import = "bazis.core.utils.query_complex.translated_name"
use_when = "the column of a translated field (TranslatedFieldWithFallback) in the active language, for a query of the project"

[[extension_points]]
name = "RouteKind"
import = "bazis.core.schemas.enums.RouteKind"
use_when = "declare what a custom route does (`kind=` of the http_* decorators, `x-bazis` in OpenAPI)"

[[extension_points]]
name = "http_* public / access_action"
import = "bazis.core.routes_abstract.initial.http_get"
use_when = "who may call a custom action: public=True (anonymous, throttled), access_action= (the permission bazis-permit enforces)"

[[extension_points]]
name = "route_declare"
import = "bazis.core.routes_abstract.initial.route_declare"
use_when = "change kind, public, access_action or dependencies of an inherited route without repeating its decorator"

[[extension_points]]
name = "bazis.core.declare"
import = "bazis.core.declare.ManagedSync"
use_when = "a package applies declarations in the code (<app>/roles.py, workflow.py, schedules.py) on migrate"

[[extension_points]]
name = "InitialRouteBase.route_check"
import = "bazis.core.routes_abstract.initial.InitialRouteBase"
use_when = "a package refuses requests by the facts of a route before its function runs: extend route_check and call super()"

[[extension_points]]
name = "throttle"
import = "bazis.core.throttle.throttle"
use_when = "limit the request rate of a route: dependencies=[throttle('10/minute', key='user_or_ip'|'ip')], 429 ERR_THROTTLED"

[[extension_points]]
name = "DynamicSMTPEmailBackend"
import = "bazis.core.mail.DynamicSMTPEmailBackend"
use_when = "send e-mail with django.core.mail: the SMTP settings and DEFAULT_FROM_EMAIL are dynamic (E-mail)"

[[extension_points]]
name = "InitialRouteBase.route_responses"
import = "bazis.core.routes_abstract.initial.InitialRouteBase"
use_when = "document in OpenAPI the error statuses a route class fails its routes with"

[[extension_points]]
name = "InitialRouteBase.route_openapi_extra"
import = "bazis.core.routes_abstract.initial.InitialRouteBase"
use_when = "add facts to the OpenAPI operations of a route class (security, extensions)"

[[extension_points]]
name = "BazisRouter"
import = "bazis.core.routing.BazisRouter"
use_when = "register route classes and app routers"

[[extension_points]]
name = "BazisSettings"
import = "bazis.core.utils.schemas.BazisSettings"
use_when = "settings of an app (conf.py), read from BS_* variables"

[[pitfalls]]
text = "a BS_* variable is read only if a conf.py of an installed Bazis package declares it; a package never redeclares or defaults a Django setting"

[[pitfalls]]
text = "a dynamic setting (Constance) follows its BS_* variable until a value is set in the admin or with manage.py constance set; a set value wins"

[[pitfalls]]
text = "an empty DEFAULT_FROM_EMAIL saved in Constance fails every mail: manage.py constance set DEFAULT_FROM_EMAIL noreply@<domain>"
check = "bazis.W009"

[[pitfalls]]
text = "the triggers of the models are not in the migrations: migrate installs the missing and outdated ones and removes none; uninstall the affected ones before a migration that drops or renames a column they read"
check = "bazis.W008"

[[pitfalls]]
text = "BS_BAZIS_APPS='[]' turns off the settings of all Bazis packages: leave it unset"
check = "bazis.W002"

[[pitfalls]]
text = "ALLOWED_HOSTS is ['*'] by default: set BS_ALLOWED_HOSTS in production"
check = "bazis.W001"

[[pitfalls]]
text = "without DEBUG the application serves no MEDIA_ROOT (404): set BS_MEDIA_HOST_URL or serve MEDIA_URL by the web server"

[[pitfalls]]
text = "the default cache must be Redis (django-redis)"
check = "bazis.E001"

[[pitfalls]]
text = "two packages translating one msgid differently: the first catalog of LOCALE_PATHS wins; override it in the project's locale"
check = "bazis.W004"

[[pitfalls]]
text = "a language other than English needs catalogs: translate the texts of a package without one in the project's locale"
check = "bazis.W005"

[[pitfalls]]
text = "titles must stay lazy (gettext_lazy, verbose_name, format_lazy, not an f-string) so that the schemas and the OpenAPI follow the language of the request"

[[pitfalls]]
text = "edit the .po files of the project only with manage.py bazis_messages, never a script or makemessages elsewhere"

[[pitfalls]]
text = "coordinates as two FloatFields: declare a PointField(geography=True) for the near filter and the distance sorting"

[[pitfalls]]
text = "an invariant kept only in the hooks of a route is bypassed by the relationships endpoints, the transits, the admin and save(): put it in validate_item"

[[pitfalls]]
text = "an invariant over several rows checked by count() passes in every parallel request: lock_on_write on the parent, a constraint as the barrier, set_item(item_id, with_lock=True) in an action"

[[pitfalls]]
text = "a unique or exclusion constraint answers 409 ERR_CONFLICT; a not-null, check or foreign key violation is a 500: keep such rules in validate_item (422)"

[[pitfalls]]
text = "an action open to anonymous users (public=True) is limited by BAZIS_THROTTLE_PUBLIC unless it declares its own throttle; a business count is an invariant, not a rate"

[[pitfalls]]
text = "behind a proxy the throttle counts the address uvicorn trusts (forwarded_allow_ips, never '*')"

[[pitfalls]]
text = "send_mail is synchronous: send many mails from a background task after the commit and handle OSError per address"

[[pitfalls]]
text = "the hooks of a route see the item before validate_item: a hook that needs a valid item validates the writes so far with defer_validate_item"

[[pitfalls]]
text = "hook_before_update sees the values in the database, not the data of the request"

[[pitfalls]]
text = "a Django ValidationError outside validate_item is a 422 with a WARNING, not a rule; the routes never call full_clean(); type the ids of an action as keys (UUID), not str"

[[pitfalls]]
text = "a URLField accepts only a URL of the schemes of its URLValidator, or '': keep it a URLField"

[[pitfalls]]
text = "a second route set of a model needs its own get_url_prefix(); a read-only route lists its actions"

[[pitfalls]]
text = "QuerySet.update(), bulk_create(), bulk_update(), raw saves, raw SQL and deletion do not call validate_item"

[[pitfalls]]
text = "reverse relations are not in the schemas by default; include of a relation outside the schema of the action is 400 ERR_INCLUDE"

[[pitfalls]]
text = "a create or an update naming a field outside the schema of its action is 422 ERR_VALIDATE extra_forbidden; a read-only one is ignored"

[[pitfalls]]
text = "a CharField/TextField without blank=True refuses an empty or whitespace-only value on the API (422)"

[[pitfalls]]
text = "a field with choices accepts only the keys of its enum on the API (422 ERR_VALIDATE at the field): a value stored by save() or a migration that is not a choice is read, but the next update that sends it is refused"

[[pitfalls]]
text = "a calculated field is read-only, does not sort and is not a search field; as_filter=True makes it a filter key"

[[pitfalls]]
text = "filter lookups are not Django lookups: __in, __icontains, an unknown field are 400 ERR_FILTER"

[[pitfalls]]
text = "filter, sort and search reach only the fields of the LIST schema of the route: show a field in `fields` to filter by it"

[[pitfalls]]
text = "a search field that is not a field of the LIST schema of its route is left out of the search"
check = "bazis.W007"

[[pitfalls]]
text = "a route without search_fields searches every text field of its LIST schema (CharField/TextField without choices, TranslatedField): declare search_fields to search fewer, search_fields = [] for no search"

[[pitfalls]]
text = "restricting the objects of a model only in get_queryset: the relationships and `included` of the other routes see them; use restrict_queryset"

[[pitfalls]]
text = "several route sets of a model without `default_route = True` in one: the last defined one is the default route"
check = "bazis.W003"

[[pitfalls]]
text = "a route set no router registers, imported after the routed one, is the default route of its model: declare `default_route = True` on the intended one"
check = "bazis.W010"
